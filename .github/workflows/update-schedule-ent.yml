name: Update Entertainment Schedule

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch entertainment schedule from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, os, re
          from datetime import datetime, timezone

          token = os.environ['AIRTABLE_TOKEN']
          base_id = 'appQA3pBNsoVP6OfV'
          table_id = 'tbl6azb9nzO9yHCGZ'

          def extract(val):
            if val is None:
              return ''
            if isinstance(val, str):
              return val
            if isinstance(val, dict):
              return val.get('name', '') or val.get('value', '') or str(val)
            if isinstance(val, list):
              parts = []
              for item in val:
                if isinstance(item, dict):
                  parts.append(item.get('name', '') or item.get('value', '') or '')
                elif isinstance(item, str):
                  parts.append(item)
              return ', '.join(p for p in parts if p)
            return str(val)

          def parse_to_minutes(time_str):
            """Parse '7:00 PM', '7:30 PM' etc into total minutes from midnight."""
            if not time_str:
              return None
            m = re.search(r'(\d+):(\d+)\s*(AM|PM)', str(time_str), re.IGNORECASE)
            if not m:
              return None
            h, mn, ap = int(m.group(1)), int(m.group(2)), m.group(3).upper()
            if ap == 'PM' and h != 12:
              h += 12
            if ap == 'AM' and h == 12:
              h = 0
            return h * 60 + mn

          def minutes_to_12hr(total_minutes):
            """Convert total minutes from midnight to 12hr string like '5:30 PM'."""
            total_minutes = total_minutes % (24 * 60)
            h = total_minutes // 60
            mn = total_minutes % 60
            suffix = 'AM' if h < 12 else 'PM'
            h12 = h % 12 or 12
            return f'{h12}:{mn:02d} {suffix}'

          def resolve_call_time(raw_val, game_time_str):
            """
            Convert a raw call time value to a proper 12hr string using game time for context.
            - Ice Crew Call Time: plain text like '5:30' or '4:30PM' (no reliable AM/PM)
            - Dance Team Call Time: Airtable duration field = seconds from midnight (absolute)
            """
            if not raw_val and raw_val != 0:
              return ''
            game_mins = parse_to_minutes(game_time_str)

            # Duration field (integer seconds from midnight)
            if isinstance(raw_val, (int, float)):
              total_secs = int(raw_val)
              total_mins = total_secs // 60  # e.g. 17100s = 285 mins = 4:45
              # Airtable duration fields store seconds of duration, not time-of-day.
              # If total_mins < 720 (noon), assume it's an offset before game time.
              # If >= 720, it looks like an absolute time of day in minutes.
              if total_mins >= 720 and game_mins is not None:
                # Treat as absolute minutes from midnight
                return minutes_to_12hr(total_mins)
              elif game_mins is not None:
                # Treat as minutes before game time (crew call = game - offset)
                call_mins = game_mins - total_mins
                return minutes_to_12hr(call_mins)
              else:
                return minutes_to_12hr(total_mins)

            # String value
            if isinstance(raw_val, str):
              raw_val = raw_val.strip()
              # Already has AM/PM — parse and reformat cleanly
              if re.search(r'(AM|PM)', raw_val, re.IGNORECASE):
                m = re.search(r'(\d+):(\d+)\s*(AM|PM)', raw_val, re.IGNORECASE)
                if m:
                  h, mn, ap = int(m.group(1)), int(m.group(2)), m.group(3).upper()
                  return f'{h}:{mn:02d} {ap}'
                return raw_val

              # No AM/PM — infer from game time
              # Format: "H:MM" — treat hour as is and figure out AM/PM from game context
              m = re.match(r'^(\d+):(\d+)', raw_val)
              if m and game_mins is not None:
                h, mn = int(m.group(1)), int(m.group(2))
                # Try PM first (add 12 if h < 12) and see if it's within 6hrs before game
                call_mins_pm = (h + 12) * 60 + mn if h < 12 else h * 60 + mn
                call_mins_am = h * 60 + mn
                diff_pm = game_mins - call_mins_pm
                diff_am = game_mins - call_mins_am
                # Prefer whichever gives a plausible call time (0-6hrs before game)
                if 0 <= diff_pm <= 360:
                  return minutes_to_12hr(call_mins_pm)
                elif 0 <= diff_am <= 360:
                  return minutes_to_12hr(call_mins_am)
                # fallback: if game is PM, assume call is PM
                elif game_mins >= 720:
                  return minutes_to_12hr(call_mins_pm)
                else:
                  return minutes_to_12hr(call_mins_am)
              elif m:
                h, mn = int(m.group(1)), int(m.group(2))
                return minutes_to_12hr(h * 60 + mn)

            return str(raw_val)

          all_records = []
          offset = None
          while True:
            url = f'https://api.airtable.com/v0/{base_id}/{table_id}?pageSize=100'
            if offset:
              url += f'&offset={offset}'
            req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/json'
            })
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
            all_records.extend(data.get('records', []))
            offset = data.get('offset')
            if not offset:
              break

          skip = {
            'Game Date', 'DOW', 'Opponent', 'Game Time',
            'Production Crew Call', 'Ice Crew Call Time', 'Dance Team Call Time',
            'Crew Complete', 'Last Modified', 'Created', 'Created By',
            'Post Game Photo', 'Post Game Slapshot',
            'Gameday Uniform', 'Uniform',
            'Dance Team Performance Song', 'DT Performance Location',
            'Entertainment Staff Link Hub', 'Training',
          }

          ice_crew_fields = [f'Ice Crew #{i}' for i in range(1, 19)]
          dance_team_fields = ['Dance Team 1','Dance Team 2','Dance Team 3',
            'Dance Team 4','Dance Team 5','Dance Team 6','Dance Team 7',
            'Dance Team 8','Dance Team 9','Dance Team 10',
            'Dance Team 11','Dance Team 11-','Dance Team 12']
          stage_manager_fields = ['Stage Manager 1','Stage Manager 2',
            'Stage Manager 3','Stage Manager 4','Stage Managing']
          mascot_fields = ['Stanley','Viktor','Handler 1','Handler 2']
          activation_fields = ['Activation Team 1','Activation Team 2',
            'Activation Team 3','Activation Team 4',
            'Activation Team 5','Activation Team 6']
          management_fields = ['Executive Producer','Entertainment Producer',
            'Associate Producer','Dance Team Manager',
            'Entertainment Specialist','Gameday Associate / Intern','Anthem Singer']

          clean = []
          for r in all_records:
            f = r['fields']
            date_val = extract(f.get('Game Date', ''))
            if not date_val or len(date_val) != 10 or date_val < '2025-08-01':
              continue

            game_time = extract(f.get('Game Time', ''))
            ice_crew_call_raw = f.get('Ice Crew Call Time', '')
            dt_call_raw = f.get('Dance Team Call Time', '')

            rec = {
              'id': r['id'],
              'date': date_val,
              'dow': extract(f.get('DOW', '')),
              'opponent': extract(f.get('Opponent', '')),
              'gameTime': game_time,
              'iceCrewCall': resolve_call_time(ice_crew_call_raw, game_time),
              'iceCrewUniform': extract(f.get('Gameday Uniform', '')),
              'danceTeamCall': resolve_call_time(dt_call_raw, game_time),
              'danceTeamUniform': extract(f.get('Uniform', '')),
              'roles': {
                'management': {},
                'iceCrewMembers': {},
                'danceTeamMembers': {},
                'stageManagers': {},
                'mascots': {},
                'activation': {},
              }
            }

            for key, val in f.items():
              extracted = extract(val)
              if not extracted:
                continue
              if key in management_fields:
                rec['roles']['management'][key] = extracted
              elif key in ice_crew_fields:
                rec['roles']['iceCrewMembers'][key] = extracted
              elif key in dance_team_fields:
                rec['roles']['danceTeamMembers'][key] = extracted
              elif key in stage_manager_fields:
                rec['roles']['stageManagers'][key] = extracted
              elif key in mascot_fields:
                rec['roles']['mascots'][key] = extracted
              elif key in activation_fields:
                rec['roles']['activation'][key] = extracted

            clean.append(rec)

          clean.sort(key=lambda x: x['date'])

          with open('schedule-ent.json', 'w') as f:
            json.dump({'updated': datetime.now(timezone.utc).isoformat(), 'records': clean}, f)

          print(f'Wrote {len(clean)} records to schedule-ent.json')
          # Print a few samples to verify call times
          for rec in clean[:3]:
            print(f"  {rec['date']} vs {rec['opponent']} | Game: {rec['gameTime']} | Ice: {rec['iceCrewCall']} | DT: {rec['danceTeamCall']}")
          EOF

      - name: Commit and push schedule-ent.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule-ent.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update ent schedule $(date -u '+%Y-%m-%d')"
          git push
