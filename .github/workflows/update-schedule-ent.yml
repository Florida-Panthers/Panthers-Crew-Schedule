name: Update Entertainment Schedule

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch entertainment schedule from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, os, re
          from datetime import datetime, timezone

          token = os.environ['AIRTABLE_TOKEN']
          base_id = 'appQA3pBNsoVP6OfV'
          table_id = 'tbl6azb9nzO9yHCGZ'

          def extract(val):
            if val is None:
              return ''
            if isinstance(val, str):
              return val
            if isinstance(val, dict):
              return val.get('name', '') or val.get('value', '') or str(val)
            if isinstance(val, list):
              parts = []
              for item in val:
                if isinstance(item, dict):
                  parts.append(item.get('name', '') or item.get('value', '') or '')
                elif isinstance(item, str):
                  parts.append(item)
              return ', '.join(p for p in parts if p)
            return str(val)

          def game_time_to_minutes(game_time_str):
            """Parse '6:00 PM' or '7:30 PM' into total minutes from midnight."""
            if not game_time_str:
              return None
            m = re.search(r'(\d+):(\d+)\s*(AM|PM)', str(game_time_str), re.IGNORECASE)
            if not m:
              return None
            h, mn, ap = int(m.group(1)), int(m.group(2)), m.group(3).upper()
            if ap == 'PM' and h != 12:
              h += 12
            if ap == 'AM' and h == 12:
              h = 0
            return h * 60 + mn

          def minutes_to_12hr(total_minutes):
            """Convert total minutes from midnight to '3:30 PM' format."""
            h = (total_minutes // 60) % 24
            mn = total_minutes % 60
            suffix = 'AM' if h < 12 else 'PM'
            h12 = h % 12 or 12
            return f'{h12}:{mn:02d} {suffix}'

          def resolve_call_time(raw_val, game_time_str):
            """
            Convert raw Airtable call time value to a proper 12hr time string.

            Duration field (Dance Team Call Time):
              Airtable stores duration as total seconds. The field is configured as h:mm
              format, so 12600s = 3h30m = displayed as "3:30" in Airtable.
              This is the LITERAL call time hour:minute — we just need to add AM/PM.

            Text field (Ice Crew Call Time):
              Stored as plain text like "4:30" or "5:30PM".
              Same approach — treat the number as literal h:mm and infer AM/PM.

            AM/PM inference:
              Use the game time. A call time of h:mm is PM if treating it as PM puts
              it within 6 hours before the game. Otherwise AM.
            """
            if raw_val is None or raw_val == '':
              return ''

            game_mins = game_time_to_minutes(game_time_str)
            call_h = None
            call_mn = None

            # Duration field returns integer seconds
            if isinstance(raw_val, (int, float)):
              total_secs = int(raw_val)
              call_h = total_secs // 3600
              call_mn = (total_secs % 3600) // 60

            # Text field — strip and parse
            elif isinstance(raw_val, str):
              raw_val = raw_val.strip()
              # Already has AM/PM
              m = re.search(r'(\d+):(\d+)\s*(AM|PM)', raw_val, re.IGNORECASE)
              if m:
                h, mn, ap = int(m.group(1)), int(m.group(2)), m.group(3).upper()
                total = (h + (12 if ap == 'PM' and h != 12 else 0)) * 60 + mn
                return minutes_to_12hr(total)
              # No AM/PM — parse h:mm
              m = re.match(r'^(\d+):(\d+)', raw_val)
              if m:
                call_h, call_mn = int(m.group(1)), int(m.group(2))

            if call_h is None:
              return ''

            # Now infer AM/PM using game time
            # The call time as PM (h + 12 if h < 12)
            call_mins_pm = (call_h + 12) * 60 + call_mn if call_h < 12 else call_h * 60 + call_mn
            # The call time as AM
            call_mins_am = call_h * 60 + call_mn

            if game_mins is not None:
              diff_pm = game_mins - call_mins_pm
              diff_am = game_mins - call_mins_am
              # Prefer PM if it falls 0-6 hours before game
              if 0 <= diff_pm <= 360:
                return minutes_to_12hr(call_mins_pm)
              # Otherwise try AM (e.g. matinee games)
              elif 0 <= diff_am <= 360:
                return minutes_to_12hr(call_mins_am)
              # Fallback: if game is in the evening, assume PM
              elif game_mins >= 720:
                return minutes_to_12hr(call_mins_pm)
              else:
                return minutes_to_12hr(call_mins_am)

            # No game time available — default PM for h < 12
            return minutes_to_12hr(call_mins_pm)

          all_records = []
          offset = None
          while True:
            url = f'https://api.airtable.com/v0/{base_id}/{table_id}?pageSize=100'
            if offset:
              url += f'&offset={offset}'
            req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/json'
            })
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
            all_records.extend(data.get('records', []))
            offset = data.get('offset')
            if not offset:
              break

          ice_crew_fields    = [f'Ice Crew #{i}' for i in range(1, 19)]
          dance_team_fields  = ['Dance Team 1','Dance Team 2','Dance Team 3',
                                'Dance Team 4','Dance Team 5','Dance Team 6',
                                'Dance Team 7','Dance Team 8','Dance Team 9',
                                'Dance Team 10','Dance Team 11','Dance Team 11-','Dance Team 12']
          stage_mgr_fields   = ['Stage Manager 1','Stage Manager 2',
                                'Stage Manager 3','Stage Manager 4','Stage Managing']
          mascot_fields      = ['Stanley','Viktor','Handler 1','Handler 2']
          activation_fields  = ['Activation Team 1','Activation Team 2','Activation Team 3',
                                'Activation Team 4','Activation Team 5','Activation Team 6']
          management_fields  = ['Executive Producer','Entertainment Producer',
                                'Associate Producer','Dance Team Manager',
                                'Entertainment Specialist','Gameday Associate / Intern',
                                'Anthem Singer']

          clean = []
          for r in all_records:
            f = r['fields']
            date_val = extract(f.get('Game Date', ''))
            if not date_val or len(date_val) != 10 or date_val < '2025-08-01':
              continue

            game_time = extract(f.get('Game Time', ''))

            rec = {
              'id': r['id'],
              'date': date_val,
              'dow': extract(f.get('DOW', '')),
              'opponent': extract(f.get('Opponent', '')),
              'gameTime': game_time,
              'iceCrewCall': resolve_call_time(f.get('Ice Crew Call Time', ''), game_time),
              'iceCrewUniform': extract(f.get('Gameday Uniform', '')),
              'danceTeamCall': resolve_call_time(f.get('Dance Team Call Time'), game_time),
              'danceTeamUniform': extract(f.get('Uniform', '')),
              'roles': {
                'management': {},
                'iceCrewMembers': {},
                'danceTeamMembers': {},
                'stageManagers': {},
                'mascots': {},
                'activation': {},
              }
            }

            for key, val in f.items():
              extracted = extract(val)
              if not extracted:
                continue
              if key in management_fields:
                rec['roles']['management'][key] = extracted
              elif key in ice_crew_fields:
                rec['roles']['iceCrewMembers'][key] = extracted
              elif key in dance_team_fields:
                rec['roles']['danceTeamMembers'][key] = extracted
              elif key in stage_mgr_fields:
                rec['roles']['stageManagers'][key] = extracted
              elif key in mascot_fields:
                rec['roles']['mascots'][key] = extracted
              elif key in activation_fields:
                rec['roles']['activation'][key] = extracted

            clean.append(rec)

          clean.sort(key=lambda x: x['date'])

          with open('schedule-ent.json', 'w') as fout:
            json.dump({'updated': datetime.now(timezone.utc).isoformat(), 'records': clean}, fout)

          print(f'Wrote {len(clean)} records to schedule-ent.json')
          for rec in clean[:5]:
            print(f"  {rec['date']} vs {rec['opponent']} | Game: {rec['gameTime']} | Ice: {rec['iceCrewCall']} | DT: {rec['danceTeamCall']}")
          EOF

      - name: Commit and push schedule-ent.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule-ent.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update ent schedule $(date -u '+%Y-%m-%d')"
          git push
