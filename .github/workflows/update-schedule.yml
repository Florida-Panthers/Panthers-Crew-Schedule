name: Update Schedule

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch schedule from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, os
          from datetime import datetime, timezone

          token = os.environ['AIRTABLE_TOKEN']
          base_id = os.environ['AIRTABLE_BASE_ID']
          table_id = 'tblPxTG3XEiKJS6C3'

          role_fields = [
            'Executive Producer', 'Entertainment Producer', 'Associate Producer',
            'Production Associate', 'Engineer/AV Lead', 'Engineer 2',
            'PA Announcer', 'Host', 'Stage Manager 1', 'Stage Manager 2',
            'Stage Manager 3', 'Stage Manager 4', 'Stage Manager 5',
            'Organist', 'Spotter', 'DJ', 'Director', 'Technical Director',
            'Click Audio / Music', 'Ross Tessera 1 (LED)', 'Ross Tessera 2 (LED)',
            'Ross Kiva (Video Playback)', 'Replay (A & B)', 'Replay (C & D)',
            'Replay (Alternate)', 'CG', 'Audio 1 / Mixer', 'Shader',
            'Camera 1', 'Camera 2', 'Camera 3', 'Camera 4 (Video Coach Cam)',
            'Camera 5 (Wireless)', 'Grip', 'Robo Camera 5', 'Robo Camera 6 & 7',
            'Robo Camera 7', 'Lighting', 'Lighting Engineer',
            'Spot 1', 'Spot 2', 'Spot 3', 'Spot 4', 'SMT',
            'Audio Engineer', 'Video Engineer', 'Utility / Training',
            'Blimp Operator 1', 'Blimp Operator 2', 'Projection SMT (Catwalk)',
            'ENG Shooter 1', 'ENG Shooter 2', 'ENG Shooter 3',
            'Training', 'Training 2',
          ]

          all_records = []
          offset = None

          while True:
            url = f'https://api.airtable.com/v0/{base_id}/{table_id}?pageSize=100'
            if offset:
              url += f'&offset={offset}'
            req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/json'
            })
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
            all_records.extend(data.get('records', []))
            offset = data.get('offset')
            if not offset:
              break

          print(f'Fetched {len(all_records)} total records')

          def get_name(val):
            if isinstance(val, dict):
              return val.get('name', '')
            elif isinstance(val, list):
              return ', '.join(item.get('name', '') for item in val if isinstance(item, dict))
            elif isinstance(val, str):
              return val
            return ''

          clean = []
          for r in all_records:
            f = r['fields']
            date_val = get_name(f.get('Game Date', '')) or f.get('Game Date', '')
            if isinstance(date_val, str) and len(date_val) == 10:
              pass
            else:
              date_val = ''
            if not date_val or date_val < '2025-08-01':
              continue
            rec = {
              'id': r['id'],
              'date': date_val,
              'dow': get_name(f.get('DOW', '')),
              'opponent': get_name(f.get('Opponent', '')),
              'gameTime': f.get('Game Time', ''),
              'crewCall': f.get('Crew Call', ''),
              'crewMeeting': f.get('Crew Meeting', ''),
              'roles': {}
            }
            for role in role_fields:
              val = f.get(role)
              if val:
                rec['roles'][role] = get_name(val)
            clean.append(rec)

          clean.sort(key=lambda x: x['date'])

          with open('schedule.json', 'w') as f:
            json.dump({'updated': datetime.now(timezone.utc).isoformat(), 'records': clean}, f)

          print(f'Wrote {len(clean)} 2025-26 records to schedule.json')
          EOF

      - name: Commit and push schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update schedule $(date -u '+%Y-%m-%d')"
          git push
