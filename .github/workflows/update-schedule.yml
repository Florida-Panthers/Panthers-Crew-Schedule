name: Update Schedule

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch schedule from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, os
          from datetime import datetime, timezone

          token = os.environ['AIRTABLE_TOKEN']
          base_id = os.environ['AIRTABLE_BASE_ID']
          table_id = 'tblPxTG3XEiKJS6C3'

          def extract(val):
            if val is None:
              return ''
            if isinstance(val, str):
              return val
            if isinstance(val, dict):
              return val.get('name', '') or val.get('value', '') or str(val)
            if isinstance(val, list):
              parts = []
              for item in val:
                if isinstance(item, dict):
                  parts.append(item.get('name', '') or item.get('value', '') or '')
                elif isinstance(item, str):
                  parts.append(item)
              return ', '.join(p for p in parts if p)
            return str(val)

          all_records = []
          offset = None
          while True:
            url = f'https://api.airtable.com/v0/{base_id}/{table_id}?pageSize=100'
            if offset:
              url += f'&offset={offset}'
            req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/json'
            })
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
            all_records.extend(data.get('records', []))
            offset = data.get('offset')
            if not offset:
              break

          skip = {'Game Date', 'DOW', 'Opponent', 'Game Time', 'Crew Call',
                  'Crew Meeting', 'Conversion?', 'Crew Complete', 'Last Modified',
                  'Created', 'Created By', '2023 Stanley Cup Playoffs Round 1'}

          clean = []
          for r in all_records:
            f = r['fields']
            date_val = extract(f.get('Game Date', ''))
            if not date_val or len(date_val) != 10 or date_val < '2025-08-01':
              continue
            rec = {
              'id': r['id'],
              'date': date_val,
              'dow': extract(f.get('DOW', '')),
              'opponent': extract(f.get('Opponent', '')),
              'gameTime': extract(f.get('Game Time', '')),
              'crewCall': extract(f.get('Crew Call', '')),
              'crewMeeting': extract(f.get('Crew Meeting', '')),
              'roles': {}
            }
            for key, val in f.items():
              if key in skip:
                continue
              extracted = extract(val)
              if extracted:
                rec['roles'][key] = extracted
            clean.append(rec)

          clean.sort(key=lambda x: x['date'])

          with open('schedule.json', 'w') as f:
            json.dump({'updated': datetime.now(timezone.utc).isoformat(), 'records': clean}, f)

          print(f'Wrote {len(clean)} records to schedule.json')
          EOF

      - name: Commit and push schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update schedule $(date -u '+%Y-%m-%d')"
          git push
